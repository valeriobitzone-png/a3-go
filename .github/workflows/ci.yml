name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Clone pinned sibling a3
        run: git clone --depth 1 --branch closeout-v1.0 https://github.com/valeriobitzone-png/a3.git "$GITHUB_WORKSPACE/../a3"
      - run: go test ./...
